<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sanpo Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=12">
</head>
<body>
<div id="map"></div>
<div id="tint"></div>
<canvas id="fog"></canvas>
<canvas id="fx"></canvas>
<div id="haze"></div>
<div id="sun"></div>
<header id="hud">
  <div class="stat"><b id="s-today">0 m</b><small>今日の散歩</small></div>
  <div class="stat"><b id="s-area">0.000 km²</b><small>はれた霧</small></div>
  <div class="stat"><b id="s-found">0</b><small>みつけた名所</small></div>
</header>
<div id="lvl"><span id="coins">🪙 0</span><span id="lvl-name"></span><div class="bar"><i id="lvl-fill"></i></div><small id="lvl-next"></small></div>
<div id="hint" hidden></div>
<div id="toast" hidden></div>
<div id="status">位置情報を取得中…</div>
<div id="btns">
  <button id="btn-view" title="見下ろし/斜め">🧭</button>
  <button id="btn-build" title="つくる">🔨</button>
  <button id="btn-book" title="冒険の書">📖</button>
  <button id="btn-locate" title="現在地へ">📍</button>
  <button id="btn-debug" title="テスト移動">🧪</button>
</div>
<div id="placebar" hidden>
  <span id="place-text"></span>
  <button id="place-here">足もとに置く</button>
  <button id="place-cancel">やめる</button>
</div>
<section id="build" hidden>
  <div class="card">
    <h2>🔨 つくる <small id="build-gold"></small></h2>
    <p class="note">コインで買って、あなたの40m以内に置けます。</p>
    <div id="build-list"></div>
    <button id="build-close">閉じる</button>
  </div>
</section>
<section id="obj" hidden>
  <div class="card">
    <h2 id="obj-title"></h2>
    <div id="obj-sub" class="note"></div>
    <button id="obj-evo"></button>
    <button id="obj-del" class="danger"></button>
    <button id="obj-close">閉じる</button>
  </div>
</section>
<section id="book" hidden>
  <div class="card">
    <h2>📖 冒険の書</h2>
    <ul id="book-list"></ul>
    <button id="book-close">閉じる</button>
  </div>
</section>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="art.js?v=12"></script>
<script src="game.js?v=12"></script>
</body>
</html>
