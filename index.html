<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sanpo World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="world"></canvas>
<header id="hud">
  <div class="stat"><b id="s-today">0 m</b><small>今日の散歩</small></div>
  <div class="stat"><b id="s-area">0.000 km²</b><small>ひらいた土地</small></div>
  <div class="stat"><b id="s-found">0</b><small>みつけた名所</small></div>
</header>
<div id="toast" hidden></div>
<div id="status">位置情報を取得中…</div>
<div id="btns">
  <button id="btn-zoom-in">＋</button>
  <button id="btn-zoom-out">－</button>
  <button id="btn-locate" title="現在地へ">📍</button>
  <button id="btn-debug" title="テスト移動">🧪</button>
</div>
<script src="game.js"></script>
</body>
</html>
