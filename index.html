<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sanpo Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<canvas id="fog"></canvas>
<header id="hud">
  <div class="stat"><b id="s-today">0 m</b><small>今日の散歩</small></div>
  <div class="stat"><b id="s-area">0.000 km²</b><small>はれた霧</small></div>
  <div class="stat"><b id="s-total">0 km</b><small>これまで</small></div>
</header>
<div id="status">位置情報を取得中…</div>
<div id="btns">
  <button id="btn-locate" title="現在地へ">📍</button>
  <button id="btn-debug" title="テスト移動">🧪</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="game.js"></script>
</body>
</html>
